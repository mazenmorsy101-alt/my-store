<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo zoz Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">Demo Store</h1>
            <div class="relative cursor-pointer" id="cartBtn">
                <i class="fa fa-shopping-cart text-xl"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-16 px-4 text-center">
        <h2 class="text-4xl font-bold mb-3">Welcome to My Demo Store</h2>
        <p class="text-lg opacity-90">This is for demo  only</p>
    </header>

    <!-- Products Grid -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Products will load here -->
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="fixed right-0 top-0 h-full w-full md:w-[420px] bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50">
        <div class="p-6 h-full flex flex-col">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold">Your Cart</h3>
                <button id="closeCart" class="text-gray-500 hover:text-black">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto py-4 space-y-4">
                <!-- Cart items here -->
            </div>

            <div class="border-t pt-4 mt-auto">
                <div class="flex justify-between text-xl font-bold mb-4">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button id="checkoutBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-lg font-semibold transition">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

    <footer class="bg-gray-900 text-gray-300 py-8 mt-16 text-center px-4">
        <p class="font-medium">⚠️ THIS IS A DEMO STORE</p>
        <p class="mt-2 text-sm">No real transactions can be made. For educational purposes only.</p>
        <p class="mt-3 text-xs opacity-70">Always use official regulated payment processors for real stores</p>
    </footer>

    <script>
        // Demo product data
        const products = [
            { id: 1, name: "Wireless Headphones", price: 89.99, image: "https://picsum.photos/id/3/400/300" },
            { id: 2, name: "Smart Watch", price: 129.99, image: "https://picsum.photos/id/26/400/300" },
            { id: 3, name: "Portable Charger", price: 34.99, image: "https://picsum.photos/id/96/400/300" },
            { id: 4, name: "Bluetooth Speaker", price: 59.99, image: "https://picsum.photos/id/7/400/300" },
            { id: 5, name: "Phone Case", price: 19.99, image: "https://picsum.photos/id/160/400/300" },
            { id: 6, name: "Laptop Stand", price: 49.99, image: "https://picsum.photos/id/119/400/300" },
        ];

        let cart = [];

        // Initialize store
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
                    <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                    <div class="p-5">
                        <h3 class="font-semibold text-lg mb-1">${product.name}</h3>
                        <p class="text-xl font-bold text-indigo-600 mb-4">$${product.price.toFixed(2)}</p>
                        <button onclick="addToCart(${product.id})" class="w-full bg-indigo-100 hover:bg-indigo-600 hover:text-white text-indigo-600 py-2.5 rounded-lg font-medium transition">
                            Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if(existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCartUI();
            openCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartTotal').textContent = `$${cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2)}`;
            
            document.getElementById('cartItems').innerHTML = cart.length === 0 
                ? `<p class="text-gray-400 text-center py-10">Your cart is empty</p>`
                : cart.map(item => `
                    <div class="flex gap-3 border-b pb-3">
                        <img src="${item.image}" class="w-16 h-16 rounded object-cover">
                        <div class="flex-1">
                            <h4 class="font-medium">${item.name}</h4>
                            <p class="text-sm text-gray-500">Qty: ${item.quantity} | $${item.price.toFixed(2)} each</p>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700">
                            <i class="fa fa-trash"></i>
                        </button>
                    </div>
                `).join('');
        }

        // Cart controls
        function openCart() {
            document.getElementById('cartSidebar').classList.remove('translate-x-full');
            document.getElementById('overlay').classList.remove('hidden');
        }
        function closeCart() {
            document.getElementById('cartSidebar').classList.add('translate-x-full');
            document.getElementById('overlay').classList.add('hidden');
        }

        // Event listeners
        document.getElementById('cartBtn').addEventListener('click', openCart);
        document.getElementById('closeCart').addEventListener('click', closeCart);
        document.getElementById('overlay').addEventListener('click', closeCart);
        
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            alert('⚠️ This is only a demo.\nFor a real store you must integrate a certified secure payment provider like Stripe, PayPal, Square or your regional regulated payment processor. Never process payments yourself directly.');
        });

        // Load store
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
